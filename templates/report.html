<!DOCTYPE html>
<html>
<head>
    <title>Ҳисобот</title>
</head>
<body>

<h1>📊 Ҳисоботи официантҳо</h1>

<table border="1" width="100%">
<tr>
    <th>Официант</th>
    <th>Даромад (смн)</th>
    <th>10% даромади пешхизмат</th>
</tr>

{% for r in data %}
<tr>
    <td>{{ r[0] }}</td>
    <td>{{ r[1] }}</td>
    <td>{{ r[2] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
